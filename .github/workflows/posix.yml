name: POSIX Compliance

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  pjdfstest:
    name: pjdfstest (8789 tests)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Build test container
        run: docker build -f Dockerfile.test -t oxfs-test .
      - name: Run pjdfstest
        run: |
          docker run --rm --privileged oxfs-test '
            mkdir -p /tmp/m /tmp/d
            /app/target/release/oxfs mount /tmp/m --backend fs --root /tmp/d \
              --meta-db /tmp/t.db --default-permissions 2>/dev/null &
            sleep 2 && cd /tmp/m
            prove -r /opt/pjdfstest/tests/ 2>&1 | tail -5
          '
