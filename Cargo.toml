[workspace]
resolver = "2"
members = [
    "crates/oxfs-meta",
    "crates/oxfs-data",
    "crates/oxfs-cache",
    "crates/oxfs-vfs",
    "crates/oxfs-fuse",
    "crates/oxfs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

oxfs-meta = { path = "crates/oxfs-meta" }
oxfs-data = { path = "crates/oxfs-data" }
oxfs-cache = { path = "crates/oxfs-cache" }
oxfs-vfs = { path = "crates/oxfs-vfs" }
oxfs-fuse = { path = "crates/oxfs-fuse" }
