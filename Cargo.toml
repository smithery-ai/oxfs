[workspace]
resolver = "2"
members = [
    "crates/oxfs-flat",
    "crates/oxfs-posix",
    "crates/oxfs-backend",
    "crates/oxfs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

oxfs-flat = { path = "crates/oxfs-flat" }
oxfs-posix = { path = "crates/oxfs-posix" }
oxfs-backend = { path = "crates/oxfs-backend" }
